services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blogsite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blogsite"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BLOG_APP_ENV: production
      BLOG_SERVER_PORT: "8080"
      BLOG_SERVER_MODE: release
      BLOG_DATABASE_HOST: postgres
      BLOG_DATABASE_PORT: "5432"
      BLOG_DATABASE_USER: postgres
      BLOG_DATABASE_PASSWORD: postgres
      BLOG_DATABASE_NAME: blogsite
      BLOG_DATABASE_AUTO_MIGRATE: "true"
      BLOG_JWT_SECRET: change-me-in-production
      BLOG_ADMIN_USERNAME: admin
      BLOG_ADMIN_PASSWORD: admin123
      BLOG_STORAGE_DRIVER: local
      BLOG_STORAGE_LOCAL_DIR: /app/uploads
      BLOG_STORAGE_LOCAL_BASE_URL: /uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
